<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Turkey Run — The Great Thanksgiving Escape</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    background: #2b1a0c;
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: Georgia, 'Times New Roman', serif;
  }
  #wrap {
    text-align: center;
  }
  canvas {
    display: block;
    width: min(1280px, 100vw);
    height: auto;
    background: #f7b267;
    border: 4px solid #7a4a21;
    border-radius: 8px;
    box-shadow: 0 8px 40px rgba(0, 0, 0, 0.6);
    cursor: pointer;
  }
  #hint {
    color: #ffe9a8;
    font-size: 14px;
    margin-top: 10px;
  }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="game" width="1280" height="720"></canvas>
  <div id="hint">SPACE jump &nbsp;•&nbsp; ← → steer &nbsp;•&nbsp; SHIFT dash &nbsp;•&nbsp; ↓ hide in the hay &nbsp;•&nbsp; P pause &nbsp;•&nbsp; M mute</div>
</div>
<script type="module" src="./src/main.js"></script>
</body>
</html>
